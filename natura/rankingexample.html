<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a05">
<link rel="icon" href="leaf logo.png" type="image/png">

<!-- Bootstrap 5 & Natura Style -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<title>Ranking — Natura</title>

<style>
  body {
    background-color: #030a05;
    background-image: 
      linear-gradient(rgba(25, 65, 38, 0.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 65, 38, 0.18) 1px, transparent 1px);
    background-size: 36px 36px;
    color: #ffffff;
    overflow-y: auto !important;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .user-pill {
    cursor: pointer;
    position: relative;
    z-index: 1051;
  }

  .grain {
    pointer-events: none !important;
  }

  /* NAVBAR AUTH BUTTONS */
  .btn-login-nav {
    background: #66ff33;
    color: #030a05;
    font-weight: 800;
    padding: 8px 24px;
    border-radius: 100px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(102, 255, 51, 0.4);
    font-size: 14px;
  }

  .btn-login-nav:hover {
    background: #80ff4d;
    color: #030a05;
    box-shadow: 0 0 25px rgba(102, 255, 51, 0.6);
  }

  .btn-register-nav {
    color: #ffffff;
    border: 1.5px solid rgba(102, 255, 51, 0.5);
    font-weight: 700;
    padding: 7px 22px;
    border-radius: 100px;
    text-decoration: none;
    transition: all 0.3s ease;
    font-size: 14px;
  }

  .btn-register-nav:hover {
    color: #66ff33;
    border-color: #66ff33;
    box-shadow: 0 0 15px rgba(102, 255, 51, 0.25);
  }

  .ranking-container {
    max-width: 1100px;
    margin: 0 auto;
    padding-top: 100px;
    padding-bottom: 60px;
  }

  /* REUSABLE GLASS CARD WITH NEON GREEN GLOW */
  .natura-card {
    background: rgba(6, 22, 12, 0.85);
    border: 1.5px solid rgba(102, 255, 51, 0.45);
    border-radius: 24px;
    backdrop-filter: blur(16px);
    box-shadow: 0 0 18px rgba(102, 255, 51, 0.2), inset 0 0 12px rgba(102, 255, 51, 0.08);
    transition: all 0.3s ease;
  }

  .natura-card:hover {
    border-color: rgba(102, 255, 51, 0.8);
    box-shadow: 0 0 25px rgba(102, 255, 51, 0.35), inset 0 0 18px rgba(102, 255, 51, 0.12);
  }

  /* HIGHLIGHT LOGGED IN USER */
  .current-user-card {
    border: 2px solid #66ff33 !important;
    background: rgba(102, 255, 51, 0.12) !important;
    box-shadow: 0 0 30px rgba(102, 255, 51, 0.45), inset 0 0 20px rgba(102, 255, 51, 0.2) !important;
  }

  .you-badge {
    background: #66ff33;
    color: #030a05;
    font-size: 11px;
    font-weight: 900;
    padding: 2px 10px;
    border-radius: 100px;
    display: inline-block;
    vertical-align: middle;
    text-shadow: none;
    letter-spacing: 0.3px;
  }

  /* SECTION TITLE */
  .rank-title {
    font-size: 34px;
    font-weight: 900;
    color: #ffffff;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
  }

  /* PODIUM TOP 3 */
  .podium-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 28px;
  }

  .podium-card {
    flex: 1;
    border-radius: 28px;
    text-align: center;
    padding: 24px 12px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .podium-card.rank-1 {
    height: 275px;
    border: 2px solid #66ff33;
    box-shadow: 0 0 35px rgba(102, 255, 51, 0.4), inset 0 0 20px rgba(102, 255, 51, 0.15);
  }

  .podium-card.rank-2 {
    height: 215px;
  }

  .podium-card.rank-3 {
    height: 195px;
  }

  .medal-icon {
    width: 42px;
    height: 42px;
    object-fit: contain;
    margin-bottom: 14px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  }

  .user-name-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .user-name {
    font-size: 17px;
    font-weight: 800;
    color: #ffffff;
    word-break: break-word;
  }

  .user-pts {
    font-size: 15px;
    font-weight: 800;
    color: #66ff33;
    text-shadow: 0 0 8px rgba(102, 255, 51, 0.4);
  }

  /* RANK LIST (#4 - #10) */
  .rank-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .list-row {
    border-radius: 100px;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .list-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .rank-tag {
    font-size: 22px;
    font-weight: 900;
    color: #66ff33;
    min-width: 48px;
    text-shadow: 0 0 10px rgba(102, 255, 51, 0.5);
    letter-spacing: -0.5px;
  }

  .list-name {
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
  }

  .list-pts {
    font-size: 16px;
    font-weight: 800;
    color: #66ff33;
    text-shadow: 0 0 8px rgba(102, 255, 51, 0.35);
  }

  /* RIGHT SIDEBAR - YOUR IMPACT */
  .impact-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding-top: 10px;
  }

  .outer-circle {
    width: 260px;
    height: 260px;
    border: 1px solid rgba(102, 255, 51, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    box-shadow: 0 0 20px rgba(102, 255, 51, 0.08);
  }

  .inner-circle {
    width: 200px;
    height: 200px;
    border: 2px solid #66ff33;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 52, 28, 0.8) 0%, rgba(4, 16, 9, 0.95) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px rgba(102, 255, 51, 0.3), inset 0 0 20px rgba(102, 255, 51, 0.18);
  }

  .leaf-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(102, 255, 51, 0.4));
  }

  .impact-heading {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .impact-value {
    font-size: 48px;
    font-weight: 900;
    color: #66ff33;
    line-height: 1;
    margin-bottom: 14px;
    text-shadow: 0 0 25px rgba(102, 255, 51, 0.5);
    text-align: center;
  }

  .impact-value span {
    font-size: 22px;
    font-weight: 800;
  }

  .impact-divider {
    width: 160px;
    height: 2px;
    background: rgba(102, 255, 51, 0.4);
    margin: 0 auto 16px;
    box-shadow: 0 0 8px rgba(102, 255, 51, 0.4);
  }

  .impact-text {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.85);
    text-align: center;
    max-width: 290px;
    line-height: 1.4;
  }

  @media (max-width: 991px) {
    .impact-container { padding-top: 30px; }
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div id="navbar-placeholder"></div>
  
  <!-- MAIN RANKING CONTENT -->
  <main class="container ranking-container">
    <div class="row g-5">
      
      <!-- LEFT SECTION: RANKINGS -->
      <div class="col-lg-7">
        <h1 class="rank-title">Rank This Month:</h1>

        <!-- PODIUM TOP 3 -->
        <div class="podium-wrapper">
          <!-- Dynamically populated -->
        </div>

        <!-- RANK LIST (#4 - #10) -->
        <div class="rank-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- RIGHT SECTION: YOUR IMPACT -->
      <div class="col-lg-5">
        <div class="impact-container">
          <div class="outer-circle">
            <div class="inner-circle">
              <img src="leaf logo.png" alt="Leaf" class="leaf-img">
            </div>
          </div>

          <div class="impact-heading">Your Impact</div>
          <div class="impact-value" id="impactValueDisplay">0 <span>pts</span></div>
          <div class="impact-divider"></div>
          <p class="impact-text" id="impactTextDisplay">Memuat data...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- JS SCRIPTS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="navbar-loader.js"></script>
  <script>
    /**
     * Synchronizes logged-in user points into the global rankings dataset.
     */
    function syncAndGetRankings() {
      const currentUsername = localStorage.getItem("natura_user");
      let rawRankings = localStorage.getItem("natura_rankings");
      let rankings = [];

      if (rawRankings) {
        try {
          rankings = JSON.parse(rawRankings);
          if (!Array.isArray(rankings)) rankings = [];
        } catch (e) {
          rankings = [];
        }
      }

      // Sync active logged-in user into rankings safely without overwriting admin edits
      if (currentUsername) {
        let userEntryIndex = rankings.findIndex(u => u.name && u.name.toLowerCase() === currentUsername.toLowerCase());
        let storedUserPts = localStorage.getItem("natura_user_pts");

        if (userEntryIndex !== -1) {
          let currentPts = Number(rankings[userEntryIndex].pts);
          if (isNaN(currentPts)) currentPts = 0;
          localStorage.setItem("natura_user_pts", currentPts);
        } else {
          let activePts = storedUserPts !== null ? parseInt(storedUserPts) : 0;
          if (isNaN(activePts)) activePts = 0;

          rankings.push({
            id: Date.now(),
            name: currentUsername,
            pts: activePts,
            email: currentUsername.toLowerCase().replace(/\s+/g, '.') + "@email.com",
            status: "Aktif",
            joined: "2026",
            reports: 0,
            approved: 0,
            updated: "Baru saja"
          });
          localStorage.setItem("natura_user_pts", activePts);
        }
      }

      // Sort descending by points
      rankings.sort((a, b) => (Number(b.pts) || 0) - (Number(a.pts) || 0));

      // Save updated rankings back to localStorage
      localStorage.setItem("natura_rankings", JSON.stringify(rankings));

      // Filter active users only for public leaderboard
      const activeRankings = rankings.filter(u => {
        const st = (u.status || 'Aktif').toLowerCase();
        return st === 'aktif';
      });

      return {
        rankings: activeRankings,
        currentUsername
      };
    }

    function renderLeaderboard() {
      const { rankings, currentUsername } = syncAndGetRankings();

      // Render Podium Top 3
      const podiumWrap = document.querySelector(".podium-wrapper");
      if (podiumWrap) {
        const p1 = rankings[0] || null;
        const p2 = rankings[1] || null;
        const p3 = rankings[2] || null;

        const isUserP1 = p1 && currentUsername && p1.name && p1.name.toLowerCase() === currentUsername.toLowerCase();
        const isUserP2 = p2 && currentUsername && p2.name && p2.name.toLowerCase() === currentUsername.toLowerCase();
        const isUserP3 = p3 && currentUsername && p3.name && p3.name.toLowerCase() === currentUsername.toLowerCase();

        const formatName = (u) => u ? escapeHtml(u.name || '-') : '-';
        const formatPts = (u) => u ? `${(Number(u.pts) || 0).toLocaleString('id-ID')} pts` : '-';

        podiumWrap.innerHTML = `
          <!-- Rank 2 -->
          <div class="podium-card natura-card rank-2 ${isUserP2 ? 'current-user-card' : ''}">
            <img src="silver medal.png" alt="Silver Medal" class="medal-icon" onerror="this.src='leaf logo.png'">
            <div class="user-name-container">
              <span class="user-name">${formatName(p2)}</span>
              ${isUserP2 ? '<span class="you-badge">Kamu</span>' : ''}
            </div>
            <div class="user-pts">${formatPts(p2)}</div>
          </div>

          <!-- Rank 1 -->
          <div class="podium-card natura-card rank-1 ${isUserP1 ? 'current-user-card' : ''}">
            <img src="gold medal.png" alt="Gold Medal" class="medal-icon" onerror="this.src='leaf logo.png'">
            <div class="user-name-container">
              <span class="user-name">${formatName(p1)}</span>
              ${isUserP1 ? '<span class="you-badge">Kamu</span>' : ''}
            </div>
            <div class="user-pts">${formatPts(p1)}</div>
          </div>

          <!-- Rank 3 -->
          <div class="podium-card natura-card rank-3 ${isUserP3 ? 'current-user-card' : ''}">
            <img src="bronze medal.png" alt="Bronze Medal" class="medal-icon" onerror="this.src='leaf logo.png'">
            <div class="user-name-container">
              <span class="user-name">${formatName(p3)}</span>
              ${isUserP3 ? '<span class="you-badge">Kamu</span>' : ''}
            </div>
            <div class="user-pts">${formatPts(p3)}</div>
          </div>
        `;
      }

      // Always render Rank List (#4 to #10)
      const rankList = document.querySelector(".rank-list");
      if (rankList) {
        let listHtml = "";

        for (let rankNum = 4; rankNum <= 10; rankNum++) {
          const user = rankings[rankNum - 1] || null;
          const isUser = user && currentUsername && user.name && user.name.toLowerCase() === currentUsername.toLowerCase();
          
          const nameDisplay = user ? escapeHtml(user.name || '-') : '-';
          const badgeDisplay = isUser ? ' <span class="you-badge">Kamu</span>' : '';
          const ptsDisplay = user ? `${(Number(user.pts) || 0).toLocaleString('id-ID')} pts` : '-';

          listHtml += `
            <div class="list-row natura-card ${isUser ? 'current-user-card' : ''}">
              <div class="list-left">
                <span class="rank-tag">#${rankNum}</span>
                <span class="list-name">${nameDisplay}${badgeDisplay}</span>
              </div>
              <div class="list-pts">${ptsDisplay}</div>
            </div>
          `;
        }

        rankList.innerHTML = listHtml;
      }

      // Render Impact Section
      renderUserState(rankings, currentUsername);
    }

    function renderUserState(rankings, username) {
      const authButtons = document.getElementById("authButtons");
      const userProfile = document.getElementById("userProfile");
      const userNameDisplay = document.getElementById("userNameDisplay");
      const impactValueDisplay = document.getElementById("impactValueDisplay");
      const impactTextDisplay = document.getElementById("impactTextDisplay");

      if (username) {
        if (authButtons) {
          authButtons.classList.add("d-none");
          authButtons.classList.remove("d-flex");
        }
        if (userProfile) {
          userProfile.classList.remove("d-none");
          userProfile.classList.add("d-flex");
        }
        if (userNameDisplay) {
          userNameDisplay.textContent = username;
        }

        // Find user position
        const userIndex = rankings.findIndex(u => u.name && u.name.toLowerCase() === username.toLowerCase());
        const userObj = userIndex !== -1 ? rankings[userIndex] : null;
        const userPts = userObj ? Number(userObj.pts) : parseInt(localStorage.getItem("natura_user_pts") || "0");
        const userRank = userIndex !== -1 ? userIndex + 1 : null;

        if (impactValueDisplay && impactTextDisplay) {
          impactValueDisplay.innerHTML = `${(userPts || 0).toLocaleString('id-ID')} <span>pts</span>`;
          if (userRank) {
            impactTextDisplay.innerHTML = `Selamat datang kembali, <strong>${escapeHtml(username)}</strong>!<br>Kamu berada di <strong>Peringkat #${userRank}</strong> dari ${rankings.length} peserta.`;
          } else {
            impactTextDisplay.innerHTML = `Selamat datang kembali, <strong>${escapeHtml(username)}</strong>!<br>Status akun kamu saat ini tidak aktif di papan peringkat.`;
          }
        }
      } else {
        if (authButtons) {
          authButtons.classList.remove("d-none");
          authButtons.classList.add("d-flex");
        }
        if (userProfile) {
          userProfile.classList.add("d-none");
          userProfile.classList.remove("d-flex");
        }

        if (impactValueDisplay && impactTextDisplay) {
          impactValueDisplay.innerHTML = `0 <span>pts</span>`;
          impactTextDisplay.innerHTML = `Masuk untuk melihat total poin dampak lingkungan dan posisi peringkat kamu.`;
        }
      }
    }

    function logoutUser(event) {
      if (event) event.preventDefault();
      localStorage.removeItem("natura_user");
      localStorage.removeItem("natura_role");
      localStorage.removeItem("natura_user_pts");
      window.location.reload();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    window.logoutUser = logoutUser;

    const navPlaceholder = document.getElementById("navbar-placeholder");
    if (navPlaceholder) {
      const observer = new MutationObserver((mutations, obs) => {
        if (document.getElementById("userNameDisplay") || document.getElementById("authButtons")) {
          obs.disconnect(); 
          const { rankings, currentUsername } = syncAndGetRankings();
          renderUserState(rankings, currentUsername);
        }
      });
      observer.observe(navPlaceholder, { childList: true, subtree: true });
    }

    document.addEventListener("navbarLoaded", () => {
      const { rankings, currentUsername } = syncAndGetRankings();
      renderUserState(rankings, currentUsername);
    });

    // Auto update when points or user profile change in another tab or page
    window.addEventListener("storage", (e) => {
      if (e.key === "natura_rankings" || e.key === "natura_user" || e.key === "natura_user_pts") {
        renderLeaderboard();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderLeaderboard();
    });
  </script>
</body>
</html>
