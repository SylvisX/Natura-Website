<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061d12">
<link rel="icon" href="logo.png" type="image/png">

<!-- Bootstrap 5 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<title>Daftar — Natura</title>
<style>
  /* --- Custom Error Modal Styles --- */
  .custom-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .custom-modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .custom-modal-card {
    background: #081d11;
    border: 1px solid rgba(140, 255, 56, 0.15);
    border-radius: 28px;
    width: 100%;
    max-width: 400px;
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    transform: scale(0.92);
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .custom-modal-overlay.active .custom-modal-card {
    transform: scale(1);
  }

  .custom-modal-close {
    position: absolute;
    top: 18px;
    right: 20px;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .custom-modal-close:hover {
    color: #ffffff;
  }

  .custom-modal-icon-ring {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 1px solid rgba(140, 255, 56, 0.4);
    background: rgba(140, 255, 56, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 0 20px rgba(140, 255, 56, 0.12);
  }

  .custom-modal-title {
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .custom-modal-text {
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .custom-modal-btn-primary {
    width: 100%;
    background: #8cff38;
    color: #061d12;
    border: none;
    border-radius: 50px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .custom-modal-btn-primary:hover {
    background: #a3ff59;
    transform: translateY(-1px);
  }
</style>
</head>
<body class="auth-page">
  <div class="grain"></div>
  
  <img src="Vector 39.png" alt="" class="bg-wave-line">

  <main class="auth-page-wrap">
    <div class="auth-card-split fade-scale">
      <div class="auth-left">
        <div class="auth-brand">
          <div class="auth-logo-ring">
            <img src="logo.png" alt="Natura Logo">
          </div>
          <span class="auth-brand-title">NATURA.</span>
        </div>

        <h1 class="auth-headline">
          Tumbuh lebih <span class="highlight">rimbun</span>, setiap kali masuk.
        </h1>

        <p class="auth-description">
          satu akun untuk merawat semua ruang hijaumu - terhubung, terjaga, dan selalu tumbuh.
        </p>
      </div>

      <div class="auth-right">
        <div class="auth-tabs-toggle">
          <a href="login.html" class="auth-tab-btn">Login</a>
          <a href="register.html" class="auth-tab-btn active">Register</a>
        </div>

        <div class="auth-form-head">
          <h2>Buat Akun</h2>
          <p>Daftar untuk mulai melapor dan mengumpulkan poin</p>
        </div>

        <form id="registerForm">
          <div class="auth-field">
            <label for="registerUsername">Username</label>
            <input type="text" id="registerUsername" name="username" required autocomplete="username">
          </div>

          <div class="auth-field">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" name="email" required autocomplete="email">
          </div>

          <div class="auth-field">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" name="password" required autocomplete="new-password">
          </div>

          <div class="auth-field">
            <label for="registerConfirm">Confirm Password</label>
            <input type="password" id="registerConfirm" name="confirm_password" required autocomplete="new-password">
          </div>

          <div class="auth-remember">
            <label class="auth-checkbox">
              <input type="checkbox" name="remember">
              <span>Ingat saya</span>
            </label>
          </div>

          <button type="submit" class="auth-btn-submit">Daftar</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Custom Error Modal -->
  <div id="customErrorModal" class="custom-modal-overlay">
    <div class="custom-modal-card">
      <button type="button" class="custom-modal-close" id="customModalCloseX">&times;</button>
      <div class="custom-modal-icon-ring">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8cff38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h3 id="customModalTitle" class="custom-modal-title">Registrasi Gagal</h3>
      <p id="customModalMessage" class="custom-modal-text">Terjadi kesalahan pada data yang Anda masukkan.</p>
      <button type="button" class="custom-modal-btn-primary" id="customModalBtnPrimary">Coba Lagi</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    if (localStorage.getItem("natura_role") === "admin") {
      window.location.replace("admin-dashboard.html");
    }
  });

  // Modal Helper Functions
  const modalOverlay = document.getElementById('customErrorModal');
  const modalTitle = document.getElementById('customModalTitle');
  const modalMessage = document.getElementById('customModalMessage');
  const modalCloseX = document.getElementById('customModalCloseX');
  const modalBtnPrimary = document.getElementById('customModalBtnPrimary');

  let onModalCloseCallback = null;

  function showCustomError(title, message, buttonText = "Coba Lagi", onClose = null) {
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modalBtnPrimary.textContent = buttonText;
    onModalCloseCallback = onClose;
    modalOverlay.classList.add('active');
  }

  function hideCustomError() {
    modalOverlay.classList.remove('active');
    if (typeof onModalCloseCallback === "function") {
      const cb = onModalCloseCallback;
      onModalCloseCallback = null;
      cb();
    }
  }

  modalCloseX.addEventListener('click', hideCustomError);
  modalBtnPrimary.addEventListener('click', hideCustomError);
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) hideCustomError();
  });

  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const username = document.getElementById('registerUsername').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value.trim();
    const confirmPassword = document.getElementById('registerConfirm').value.trim();

    if (!username || !email || !password || !confirmPassword) {
      showCustomError("Informasi Tidak Lengkap", "Harap isi semua kolom pendaftaran terlebih dahulu!");
      return;
    }

    // Validate email format
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      showCustomError("Format Email Salah", "Harap masukkan format email yang valid (contoh: nama@domain.com)!");
      return;
    }

    if (password !== confirmPassword) {
      showCustomError("Password Tidak Cocok", "Password dan Konfirmasi Password yang Anda masukkan tidak sama!");
      return;
    }

    // Get current registered accounts list
    const registeredUsers = JSON.parse(localStorage.getItem('natura_registered_accounts') || "[]");

    // Prevent duplicate email registrations
    const exists = registeredUsers.some(user => user.email.toLowerCase() === email.toLowerCase());
    if (exists) {
      showCustomError("Email Terdaftar", "Email ini sudah terdaftar. Silakan login menggunakan akun Anda.", "Masuk Sekarang", function() {
        window.location.href = "login.html";
      });
      return;
    }

    // Save new user details
    registeredUsers.push({ username: username, email: email, password: password });
    localStorage.setItem('natura_registered_accounts', JSON.stringify(registeredUsers));

    showCustomError("Registrasi Berhasil!", "Akun Anda telah berhasil dibuat. Silakan masuk menggunakan akun Anda.", "Masuk Sekarang", function() {
      window.location.href = "login.html";
    });
  });
  </script>
</body>
</html>
