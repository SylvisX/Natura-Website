<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Laporan — NATURA Admin</title>
  <link rel="icon" href="logo.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #021a10;
      --card-bg: rgba(6, 32, 20, 0.75);
      --card-border: rgba(34, 197, 94, 0.25);
      --green-glow: #22c55e;
      --text-muted: #83a392;
      --text-light: #e2ece6;
      --lime-accent: #a6ff4d;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.2) 0%, transparent 70%),
        linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-light);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .admin-wrapper { display: flex; min-height: 100vh; }

    .admin-sidebar {
      width: 260px;
      background: rgba(3, 20, 12, 0.85);
      border-right: 1px solid var(--card-border);
      padding: 2rem 1.25rem;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      backdrop-filter: blur(12px);
    }

    .brand-logo-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 2.2rem; padding-left: 0.5rem; }
    .brand-logo-wrap img { width: 32px; height: 32px; object-fit: contain; }
    .brand-logo-wrap span { font-weight: 800; font-size: 1.35rem; letter-spacing: 1.5px; color: #fff; }

    .nav-section-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-muted); margin-top: 1.2rem; margin-bottom: 0.6rem; padding-left: 0.75rem; text-transform: uppercase; }
    .admin-nav { list-style: none; padding: 0; margin: 0; }
    .admin-nav-item { margin-bottom: 0.4rem; }
    .admin-nav-link { display: flex; align-items: center; gap: 14px; padding: 0.7rem 1rem; color: #a8c3b3; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 0.95rem; transition: all 0.25s ease; border: 1px solid transparent; }
    .admin-nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .admin-nav-link.active { background: rgba(34, 197, 94, 0.2); color: #ffffff; border: 1px solid var(--green-glow); box-shadow: 0 0 12px rgba(34, 197, 94, 0.25); }

    .admin-content { flex-grow: 1; padding: 2rem 2.5rem; overflow-y: auto; }

    .admin-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
    .admin-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1.5px; color: #fff; margin: 0; text-transform: uppercase; }
    .admin-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .admin-user-badge { display: flex; align-items: center; gap: 10px; background: rgba(8, 38, 24, 0.85); border: 1px solid var(--card-border); padding: 6px 18px 6px 8px; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; }
    .admin-user-badge:hover { background: rgba(34, 197, 94, 0.25); border-color: var(--green-glow); box-shadow: 0 0 12px rgba(34, 197, 94, 0.3); }
    .admin-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; color: #fff; }
    .admin-user-name { font-weight: 800; font-size: 0.85rem; color: #fff; letter-spacing: 1px; }

    .filter-tabs { display: flex; gap: 12px; margin-bottom: 1.8rem; }
    .filter-tab-btn { background: rgba(6, 32, 20, 0.6); border: 1px solid var(--card-border); color: #a8c3b3; padding: 0.45rem 2rem; border-radius: 30px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.25s ease; }
    .filter-tab-btn.active { background: rgba(34, 197, 94, 0.2); border-color: var(--green-glow); color: #ffffff; box-shadow: 0 0 12px rgba(34, 197, 94, 0.25); }

    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

    @media (max-width: 992px) {
      .report-grid { grid-template-columns: 1fr; }
    }

    .report-card-item {
      background: rgba(6, 32, 20, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: inherit;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .report-card-item:hover {
      border-color: var(--green-glow);
      background: rgba(8, 42, 26, 0.85);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .card-top-row { display: flex; align-items: center; gap: 16px; }

    .card-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .card-info { flex-grow: 1; min-width: 0; }

    .card-meta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .card-rep-id { font-size: 0.78rem; font-weight: 700; color: #83a392; }

    .after-badge {
      font-size: 0.65rem;
      font-weight: 800;
      background: #a6ff4d;
      color: #040e07;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      text-transform: uppercase;
    }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .status-pill.pending { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.5); }
    .status-pill.verified { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.5); }
    .status-pill.rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); }

    .card-user-name { font-size: 1.05rem; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
    .card-user-road { font-size: 0.8rem; color: #83a392; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .card-time-bottom { font-size: 0.7rem; color: #5e8270; text-align: right; margin-top: 2px; }

    .modal-backdrop.show {
      opacity: 0.75;
      backdrop-filter: blur(8px);
    }

    .custom-modal-content {
      background: rgba(3, 20, 12, 0.95) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 24px !important;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(34, 197, 94, 0.15);
      color: #fff;
      position: relative;
    }

    .btn-close-custom {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s ease;
      z-index: 10;
    }

    .btn-close-custom:hover { color: #fff; }

    .modal-icon-wrap {
      width: 68px;
      height: 68px;
      margin: 0 auto;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
    }

    .modal-title-text { font-weight: 800; letter-spacing: 0.5px; color: #fff; font-size: 1.45rem; }
    .modal-subtitle-text { color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; }

    .btn-custom-primary {
      background: #86efac !important;
      color: #021a10 !important;
      font-weight: 700 !important;
      border-radius: 50px !important;
      padding: 12px 24px !important;
      border: none !important;
      font-size: 0.95rem;
      transition: all 0.25s ease !important;
    }

    .btn-custom-primary:hover {
      background: #4ade80 !important;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
    }

    .btn-custom-secondary {
      background: transparent !important;
      color: #e2ece6 !important;
      font-weight: 600 !important;
      border-radius: 50px !important;
      padding: 12px 24px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      font-size: 0.95rem;
      transition: all 0.25s ease !important;
    }

    .btn-custom-secondary:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">

    <aside class="admin-sidebar">
      <div class="brand-logo-wrap">
        <img src="logo.png" alt="NATURA Logo" onerror="this.src='leaf logo.png'">
        <span>NATURA.</span>
      </div>

      <div class="nav-section-title">UTAMA</div>
      <ul class="admin-nav">
        <li class="admin-nav-item">
          <a href="admin-dashboard.html" class="admin-nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Dashboard
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="report-verif.html" class="admin-nav-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            Verifikasi Laporan
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="admin-ranking.html" class="admin-nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Ranking
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="voucher-umkm.html" class="admin-nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
            Voucher & UMKM
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="petugas-kebersihan.html" class="admin-nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Petugas Kebersihan
          </a>
        </li>
      </ul>

      <div class="nav-section-title">LAINNYA</div>
      <ul class="admin-nav">
        <li class="admin-nav-item">
          <a href="#" class="admin-nav-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Pengaturan
          </a>
        </li>
      </ul>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div>
          <h1>VERIFIKASI LAPORAN</h1>
          <p id="pendingCountSub">0 laporan menunggu tindak lanjut</p>
        </div>
        <div class="admin-user-badge" onclick="logoutAdmin()" title="Klik untuk Logout">
          <div class="admin-avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <span class="admin-user-name">ADMIN</span>
        </div>
      </div>

      <div class="filter-tabs">
        <button class="filter-tab-btn active" onclick="switchTab(this, 'Menunggu')">Menunggu</button>
        <button class="filter-tab-btn" onclick="switchTab(this, 'Disetujui')">Disetujui</button>
        <button class="filter-tab-btn" onclick="switchTab(this, 'Ditolak')">Ditolak</button>
      </div>

      <div class="report-grid" id="reportGrid">

      </div>
    </main>
  </div>

  <div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content custom-modal-content">
        <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Tutup">&times;</button>
        <div class="modal-body text-center p-4 p-md-5">
          <div class="modal-icon-wrap mb-3">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </div>
          <h4 class="modal-title-text mb-2">Konfirmasi Keluar</h4>
          <p class="modal-subtitle-text mb-4">Apakah Anda yakin ingin keluar dari Admin Dashboard NATURA?</p>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-custom-primary" onclick="confirmLogout()">Keluar Sekarang</button>
            <button type="button" class="btn btn-custom-secondary" data-bs-dismiss="modal">Nanti Saja</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
    let activeFilter = 'Menunggu';
    let logoutModalInstance = null;

    const defaultReports = [
      { id: "2079", user: "Bayu Santoso", road: "Jalan Kampung Sunda No.5", date: "19 Aug 2026 - 17.16", status: "Menunggu" },
      { id: "2078", user: "Bayu Santoso", road: "Jalan Kampung Sunda No.5", date: "19 Aug 2026 - 17.16", status: "Menunggu" },
      { id: "2077", user: "Bayu Santoso", road: "Jalan Kampung Sunda No.5", date: "19 Aug 2026 - 17.16", status: "Menunggu" }
    ];

    function checkAuth() {
      const user = localStorage.getItem("natura_user");
      const role = localStorage.getItem("natura_role");

      if (!user || role !== "admin") {
        window.location.replace("login.html");
      }
    }

    function initStorage() {
      if (!localStorage.getItem("natura_reports")) {
        localStorage.setItem("natura_reports", JSON.stringify(defaultReports));
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
      initStorage();
      renderReports();
    });

    window.addEventListener("pageshow", (event) => {
      checkAuth();
    });

    function logoutAdmin() {
      if (!logoutModalInstance) {
        logoutModalInstance = new bootstrap.Modal(document.getElementById('logoutModal'));
      }
      logoutModalInstance.show();
    }

    function confirmLogout() {
      localStorage.removeItem("natura_user");
      localStorage.removeItem("natura_role");
      window.location.replace("login.html");
    }

    function switchTab(button, status) {
      document.querySelectorAll('.filter-tab-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      activeFilter = status;
      renderReports();
    }

    function renderReports() {
      const reports = JSON.parse(localStorage.getItem("natura_reports") || "[]");
      const grid = document.getElementById("reportGrid");
      const pendingSub = document.getElementById("pendingCountSub");

      const pendingCount = reports.filter(r => r.status === 'Menunggu' || r.status === 'Menunggu Verifikasi').length;
      if (pendingSub) pendingSub.textContent = `${pendingCount} laporan menunggu tindak lanjut`;

      let filtered = [];
      if (activeFilter === 'Menunggu') {
        filtered = reports.filter(r => r.status === 'Menunggu' || r.status === 'Menunggu Verifikasi');
      } else if (activeFilter === 'Disetujui') {
        filtered = reports.filter(r => r.status === 'Disetujui' || r.status === 'Diverifikasi');
      } else if (activeFilter === 'Ditolak') {
        filtered = reports.filter(r => r.status === 'Ditolak');
      }

      grid.innerHTML = "";

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="p-5 text-center text-muted col-span-full">Tidak ada laporan dengan status "${activeFilter}".</div>`;
        return;
      }

      filtered.forEach(report => {
        const displayId = report.id.startsWith("REP-") ? report.id.replace("REP-", "#") : "#" + report.id;

        let pillClass = "pending";
        let statusLabel = report.status;
        if (report.status === "Diverifikasi" || report.status === "Disetujui") {
          pillClass = "verified";
          statusLabel = "Disetujui";
        } else if (report.status === "Ditolak") {
          pillClass = "rejected";
        }

        const card = document.createElement("div");
        card.className = "report-card-item";

        card.onclick = () => {
          window.location.href = `cek-laporan-admin.html?id=${encodeURIComponent(report.id)}`;
        };

        card.innerHTML = `
          <div class="card-top-row">
            <div class="card-avatar">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="card-info">
              <div class="card-meta-top">
                <span class="card-rep-id">
                  ${displayId}
                  ${report.isAfter ? '<span class="after-badge">AFTER</span>' : ''}
                </span>
                <span class="status-pill ${pillClass}">${statusLabel}</span>
              </div>
              <div class="card-user-name">${report.user || 'Anonim'}</div>
              <div class="card-user-road">${report.road || 'Jalan Umum'}</div>
              <div class="card-time-bottom">${report.date || ''}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
