<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050f08">
<link rel="icon" href="logo.png" type="image/png">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<title>Notifikasi — Natura</title>

<style>
  body {
    overflow-y: auto !important;
  }

  .natura-toast-container {
    position: fixed;
    top: 115px;
    right: 24px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  @keyframes toastSlideOut {
    from {
      opacity: 1;
      transform: translateX(0);
    }
    to {
      opacity: 0;
      transform: translateX(120%);
    }
  }

  .natura-toast.toast-hide {
    animation: toastSlideOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .notif-container {
    max-width: 1080px;
    margin: 0 auto;
    padding-top: 110px;
    padding-bottom: 60px;
  }

  .notif-page-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 32px;
    color: #ffffff;
    margin-bottom: 24px;
  }

  .notif-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
  }

  .notif-tab-btn {
    background: transparent;
    border: 1px solid rgba(228, 232, 224, 0.4);
    color: #ffffff;
    border-radius: 100px;
    padding: 8px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .notif-tab-btn.active {
    background: rgba(45, 95, 55, 0.6);
    border-color: #a6ff4d;
    color: #ffffff;
    box-shadow: 0 0 14px rgba(166, 255, 77, 0.3);
  }

  .notif-tab-btn:hover:not(.active) {
    border-color: #a6ff4d;
    color: #a6ff4d;
  }

  .notif-card-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .notif-card {
    position: relative;
    background: #bdc5be;
    border-radius: 18px;
    padding: 16px 24px;
    color: #18221a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .notif-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }

  .notif-orange-dot {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 7px;
    height: 7px;
    background-color: #ff8c00;
    border-radius: 50%;
  }

  .notif-left {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    flex: 1;
  }

  .notif-icon-wrapper {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .notif-icon-wrapper svg {
    width: 28px;
    height: 28px;
    fill: #18221a;
  }

  .notif-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .notif-item-title {
    font-size: 16px;
    font-weight: 700;
    color: #111a13;
    line-height: 1.2;
  }

  .notif-item-desc {
    font-size: 13px;
    color: #38423a;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .notif-item-date {
    font-size: 11px;
    color: #636d65;
    font-weight: 600;
  }

  .notif-action-btn {
    background: #142a1d;
    color: #f1f7f2;
    border: none;
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .notif-action-btn:hover:not(:disabled) {
    background: #1f3f2c;
    color: #a6ff4d;
    transform: scale(1.03);
  }

  .notif-action-btn:disabled {
    background: #2e7d32;
    color: #ffffff;
    cursor: default;
    opacity: 0.9;
  }

  .empty-notif-state {
    text-align: center;
    padding: 48px 20px;
    background: rgba(14, 31, 20, 0.4);
    border: 1px dashed rgba(52, 98, 63, 0.5);
    border-radius: 18px;
    color: #8da493;
    font-size: 15px;
  }

  .user-pill {
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .user-pill[aria-expanded="true"] {
    border-color: #a6ff4d !important;
    box-shadow: 0 0 12px rgba(166, 255, 77, 0.3);
  }

  .natura-dropdown-menu {
    background-color: #06130b !important;
    border: 1px solid rgba(52, 98, 63, 0.8) !important;
    border-radius: 14px !important;
    padding: 6px 0 !important;
    min-width: 130px !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
    margin-top: 6px !important;
  }

  .natura-dropdown-menu .dropdown-item {
    color: #ffffff;
    font-weight: 600;
    font-size: 14px;
    padding: 8px 16px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .natura-dropdown-menu .dropdown-item:hover {
    background-color: rgba(255, 255, 255, 0.05);
    color: #a6ff4d;
  }

  .natura-dropdown-menu .dropdown-item.logout-item {
    color: #ff6b6b !important;
  }

  .natura-dropdown-menu .dropdown-item.logout-item:hover {
    background-color: rgba(255, 107, 107, 0.1);
    color: #ff8585 !important;
  }

  .natura-dropdown-menu .dropdown-divider {
    border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
    margin: 4px 0 !important;
  }

  @media (max-width: 768px) {
    .notif-card {
      flex-direction: column;
      align-items: flex-start;
      padding: 16px;
    }
    .notif-action-btn {
      align-self: flex-end;
    }
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="natura-toast-container" id="toastContainer"></div>

  <div id="navbar-placeholder"></div>

  <main class="container notif-container">
    <h1 class="notif-page-title">Notifikasi</h1>

    <div class="notif-tabs">
      <button class="notif-tab-btn active" onclick="filterNotif('semua', this)">Semua</button>
      <button class="notif-tab-btn" onclick="filterNotif('laporan', this)">Laporan</button>
      <button class="notif-tab-btn" onclick="filterNotif('reward', this)">Reward</button>
    </div>

    <div class="notif-card-list" id="notifList">
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="navbar-loader.js"></script>
  <script>
  const username = localStorage.getItem("natura_user");
  if (!username) {
    window.location.replace("login.html");
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (username) {
      const userDisplay = document.getElementById("userNameDisplay");
      if (userDisplay) userDisplay.textContent = username;
    }
    checkAndGenerateCleanNotifs();
    renderDynamicNotifications();

    setInterval(() => {
      checkAndGenerateCleanNotifs();
      renderDynamicNotifications();
    }, 5000);
  });

  function showToast(title, subMessage, iconPath = "logo.png", duration = 4000) {
    const container = document.getElementById("toastContainer");
    if (!container) return;

    const toast = document.createElement("div");
    toast.className = "natura-toast";

    toast.innerHTML = `
      <img src="${iconPath}" alt="Toast Icon" class="natura-toast-icon">
      <div class="natura-toast-content">
        <div class="natura-toast-title">${title}</div>
        <div class="natura-toast-sub">${subMessage}</div>
      </div>
      <button class="natura-toast-close" onclick="closeToast(this)">✕</button>
    `;

    container.appendChild(toast);

    setTimeout(() => {
      closeToast(toast.querySelector('.natura-toast-close'));
    }, duration);
  }

  function closeToast(btn) {
    const toast = btn ? btn.closest('.natura-toast') : null;
    if (toast && !toast.classList.contains('toast-hide')) {
      toast.classList.add('toast-hide');
      toast.addEventListener('animationend', () => toast.remove());
    }
  }

  function checkAndGenerateCleanNotifs() {
    const allReports = JSON.parse(localStorage.getItem("natura_reports") || "[]");
    const allNotifs = JSON.parse(localStorage.getItem("natura_notifs") || "[]");
    let updated = false;
    const now = Date.now();

    allReports.forEach(report => {
      const isApproved = (report.status === "Disetujui" || report.status === "Diverifikasi") && !report.isAfter;
      if (isApproved) {
        const approvedTime = report.approvedAt || (now - 60000);
        const notifCleanId = "NOTIF-CLEAN-" + report.id;
        const exists = allNotifs.some(n => n.id === notifCleanId);

        if (!exists && (now - approvedTime >= 60000)) {
          allNotifs.unshift({
            id: notifCleanId,
            user: report.user,
            category: "laporan",
            title: "Jalan telah dibersihkan",
            desc: "Laporkan hasil afternya disini untuk mendapatkan extra poin. Kedaluarsa sehari setelahnya.",
            date: report.approvedDate || new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
            reportId: report.id,
            type: "clean_request",
            actionUrl: `upload.html?reportId=${report.id}&type=after`
          });
          updated = true;
        }
      }
    });

    if (updated) {
      localStorage.setItem("natura_notifs", JSON.stringify(allNotifs));
    }
  }

  function renderDynamicNotifications() {
    const notifList = document.getElementById("notifList");
    if (!notifList) return;
    notifList.innerHTML = "";

    const allNotifs = JSON.parse(localStorage.getItem("natura_notifs") || "[]");
    const allReports = JSON.parse(localStorage.getItem("natura_reports") || "[]");

    const userReports = username 
      ? allReports.filter(r => !r.user || r.user === username)
      : allReports;
    const validReportIds = new Set(userReports.map(r => String(r.id)));

    const userNotifs = allNotifs.filter(notif => {
      if (notif.user && username) {
        return notif.user === username;
      }
      if (notif.reportId) {
        return validReportIds.has(String(notif.reportId));
      }
      return true;
    });

    if (userNotifs.length === 0) {
      notifList.innerHTML = `
        <div class="empty-notif-state">
          Belum ada notifikasi saat ini.
        </div>
      `;
      return;
    }

    userNotifs.forEach(notif => {
      const card = document.createElement("div");
      card.className = "notif-card";
      card.setAttribute("data-category", notif.category || "laporan");

      let actionBtnHtml = "";
      let iconSvg = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;

      if (notif.title === "Voucher Berhasil Ditukar" || notif.type === "voucher_redeemed") {
        iconSvg = `<svg viewBox="0 0 24 24" fill="#18221a"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>`;
        actionBtnHtml = `<button class="notif-action-btn" onclick="window.location.href='profile.html'">Lihat Voucher</button>`;
      }
      else if (notif.title === "Jalan telah dibersihkan" || notif.type === "clean_request") {
        iconSvg = `<svg viewBox="0 0 24 24" fill="#18221a"><path d="M19.41 2.41a2 2 0 0 0-2.83 0L10.5 8.41l5.09 5.09 6-6a2 2 0 0 0 0-2.83l-2.18-2.26zM9.08 9.83L2 16.91V22h5.09l7.08-7.08-5.09-5.09z"/></svg>`;
        
        const hasSubmittedAfter = allReports.some(r => r.isAfter && String(r.beforeReportId) === String(notif.reportId));

        if (hasSubmittedAfter) {
          actionBtnHtml = `<button class="notif-action-btn" disabled>Sudah Diupload</button>`;
        } else {
          actionBtnHtml = `<button class="notif-action-btn" onclick="window.location.href='${notif.actionUrl || 'upload.html'}'">Upload</button>`;
        }
      } 
      else if (notif.title === "Laporan after diterima" || notif.type === "after_approved") {
        iconSvg = `<svg viewBox="0 0 24 24" fill="#18221a"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;
        const pointsToClaim = notif.points || 250;
        if (notif.claimed) {
          actionBtnHtml = `<button class="notif-action-btn" disabled>Berhasil Diklaim!</button>`;
        } else {
          actionBtnHtml = `<button class="notif-action-btn" onclick="klaimPoin(event, '${notif.id}', ${pointsToClaim})">Klaim ${pointsToClaim} poin</button>`;
        }
      } 
      else {
        const isVerified = notif.status === "Terverifikasi" || 
                           notif.status === "Disetujui" || 
                           notif.isVerified || 
                           (notif.title && (notif.title.toLowerCase().includes("disetujui") || notif.title.toLowerCase().includes("terverifikasi")));
        const pointsToClaim = notif.points || 250;

        if (isVerified || notif.claimable) {
          if (notif.claimed) {
            actionBtnHtml = `<button class="notif-action-btn" disabled>Berhasil Diklaim!</button>`;
          } else {
            actionBtnHtml = `<button class="notif-action-btn" onclick="klaimPoin(event, '${notif.id}', ${pointsToClaim})">Klaim ${pointsToClaim} Poin</button>`;
          }
        } else if (notif.actionUrl) {
          actionBtnHtml = `<button class="notif-action-btn" onclick="window.location.href='${notif.actionUrl}'">Buka</button>`;
        }
      }

      card.innerHTML = `
        <span class="notif-orange-dot"></span>
        <div class="notif-left">
          <div class="notif-icon-wrapper">
            ${iconSvg}
          </div>
          <div class="notif-body">
            <div class="notif-item-title">${escapeHtml(notif.title)}</div>
            <div class="notif-item-desc">${escapeHtml(notif.desc)}</div>
            <div class="notif-item-date">${escapeHtml(notif.date)}</div>
          </div>
        </div>
        ${actionBtnHtml}
      `;

      if (notif.reportId && notif.type !== "clean_request") {
        card.style.cursor = "pointer";
        card.onclick = function(e) {
          if (e.target.tagName !== 'BUTTON') {
            window.location.href = `detail-laporan.html?id=${notif.reportId}`;
          }
        };
      }

      notifList.appendChild(card);
    });
  }

  function filterNotif(category, element) {
    document.querySelectorAll('.notif-tab-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    const cards = document.querySelectorAll('.notif-card');
    cards.forEach(card => {
      if (category === 'semua' || card.getAttribute('data-category') === category) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function klaimPoin(event, notifId, jumlahPoin) {
    if (event) event.stopPropagation();

    const btn = event.target;
    btn.textContent = "Berhasil Diklaim!";
    btn.disabled = true;

    const dynamicNotifs = JSON.parse(localStorage.getItem("natura_notifs") || "[]");
    const targetNotif = dynamicNotifs.find(n => String(n.id) === String(notifId));
    if (targetNotif) {
      targetNotif.claimed = true;
      localStorage.setItem("natura_notifs", JSON.stringify(dynamicNotifs));
    }

    const userPointsKey = username ? `natura_user_points_${username}` : "natura_user_points";

    let currentPoints = parseInt(localStorage.getItem(userPointsKey) || "0", 10);
    currentPoints += jumlahPoin;
    localStorage.setItem(userPointsKey, currentPoints.toString());

    showToast("Poin Berhasil Diklaim!", `+${jumlahPoin} Poin ditambahkan ke akunmu.`);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  function logout(event) {
    if (event) event.preventDefault();
    localStorage.removeItem("natura_user");
    window.location.replace("login.html");
  }
</script>
</body>
</html>
