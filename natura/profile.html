<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050f08">
<link rel="icon" href="logo.png" type="image/png">

<!-- Bootstrap 5 & Natura Styles -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<title>Profil Saya — Natura</title>

<style>
  body {
    background-color: #040e07;
    background-image: 
      linear-gradient(rgba(30, 70, 45, 0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 70, 45, 0.2) 1px, transparent 1px);
    background-size: 32px 32px;
    color: #ffffff;
    overflow-y: auto !important;
  }

  .profile-container {
    max-width: 1040px;
    margin: 0 auto;
    padding-top: 110px;
    padding-bottom: 60px;
  }

  /* Glass Cards */
  .natura-card {
    background: rgba(8, 24, 15, 0.65);
    border: 1px solid rgba(80, 150, 95, 0.35);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  /* Header Card */
  .user-header-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 32px;
    margin-bottom: 24px;
  }

  .avatar-circle-white {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #f0f4f1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0d2012;
    flex-shrink: 0;
  }

  .user-info-text h2 {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 2px 0;
  }

  .user-email {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 6px;
  }

  .user-joined {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
  }

  .user-role-badge {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
  }

  /* See All Link */
  .see-all-link {
    color: #a6ff4d;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }

  .see-all-link:hover {
    color: #b8ff66;
    text-decoration: underline;
  }

  /* Stat Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card-light {
    background: #c3cfd3;
    border-radius: 16px;
    padding: 16px 18px;
    color: #0a180e;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  .stat-card-icon {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }

  .stat-card-num {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
    color: #08140c;
  }

  .stat-card-label {
    font-size: 12px;
    font-weight: 600;
    color: rgba(10, 24, 14, 0.75);
    margin-top: 2px;
  }

  /* Section Title Header */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .section-header h3 {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    margin: 0;
  }

  /* History List */
  .history-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    transition: background 0.2s ease;
  }

  .history-item:not(:last-child) {
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }

  .pin-icon-bg {
    width: 40px;
    height: 40px;
    background: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #e53935;
  }

  .history-title {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 2px;
  }

  .history-sub {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
  }

  /* Voucher Items */
  .voucher-item-box {
    border: 1px dashed rgba(255, 255, 255, 0.25);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .voucher-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .voucher-icon-circle {
    width: 38px;
    height: 38px;
    background: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .voucher-icon-circle img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }

  .voucher-name {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 2px;
  }

  .voucher-desc {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.65);
  }

  .voucher-expiry {
    font-size: 12px;
    font-weight: 700;
    color: #a6ff4d;
    white-space: nowrap;
  }

  /* Exchange Voucher Button */
  .btn-exchange-voucher {
    width: 100%;
    background: rgba(8, 24, 15, 0.7);
    border: 1px solid rgba(120, 230, 130, 0.4);
    color: #ffffff;
    font-weight: 700;
    font-size: 16px;
    padding: 14px;
    border-radius: 100px;
    margin-top: 18px;
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    text-decoration: none;
    display: block;
    text-align: center;
  }

  .btn-exchange-voucher:hover {
    background: rgba(20, 50, 30, 0.85);
    border-color: #a6ff4d;
    color: #a6ff4d;
  }

  @media (max-width: 768px) {
    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .user-header-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
  }
</style>
</head>
<body>
  <div class="grain"></div>

          </svg>

      </div>

      <div class="stat-card-light">
        <div class="stat-card-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#0d2012">

            <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>

      <div class="stat-card-light">
        <div class="stat-card-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#0d2012">
            <path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5zM19 19H5V5h14v14zM9 8h6v2H9zm0 4h6v2H9z"/>
          </svg>
        </div>
        <div class="stat-card-num" id="statVouchersOwned">0</div>
        <div class="stat-card-label">Voucher Terpakai</div>
      </div>
    </div>

    <!-- MAIN TWO COLUMN CONTENT -->
    <div class="row g-4">
      <!-- LEFT COLUMN: RIWAYAT LAPORAN -->
      <div class="col-lg-6">
        <div class="natura-card h-100">
          <div class="section-header">
            <h3>Riwayat Laporan</h3>
            <a href="notif.html" class="see-all-link">Lihat Semua</a>
          </div>

          <div class="history-list" id="historyList">
            <!-- Dynamically populated from localStorage natura_reports -->
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: VOUCHER SAYA & CTA -->
      <div class="col-lg-6 d-flex flex-column gap-3">
        <div class="natura-card flex-grow-1">
          <div class="section-header">
            <h3>Voucher Saya</h3>
            <a href="voucher.html" class="see-all-link">Lihat Semua</a>
          </div>

          <div class="voucher-list" id="voucherList">
            <!-- Dynamically populated from localStorage natura_vouchers / claimed vouchers -->
          </div>

        <!-- CTA BUTTON -->
        <a href="voucher.html" class="btn-exchange-voucher">Tukarkan Voucher</a>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="navbar-loader.js"></script>
<script>
  const defaultVouchersList = [
    { id: 1, category: "Makanan", title: "Diskon 20% Beras Premium 5kg", mitra: "Toko Kelontong Bu Sri", promo: "Diskon Spesial", pts: 1500, stockLeft: 45, stockTotal: 50, address: "Jl. Kemerdekaan 5, Jakarta Selatan", icon: "hot-pot 2.png", active: true },
    { id: 2, category: "Makanan", title: "Voucher Rp 10.000 Es Cendol", mitra: "Warung Es Cendol Pak Joko", promo: "Diskon Spesial", pts: 800, stockLeft: 12, stockTotal: 20, address: "Jl. Sudirman No. 12, Jakarta Selatan", icon: "hot-pot 2.png", active: true },
    { id: 3, category: "Kerajinan", title: "Potongan 15% Kerajinan Daur Ulang", mitra: "Kreatif Green Craft", promo: "Diskon Spesial", pts: 2000, stockLeft: 85, stockTotal: 100, address: "Jl. Gatot Subroto No. 45, Jakarta Selatan", icon: "hot-pot 2.png", active: true },
    { id: 4, category: "Pertanian", title: "Gratis 1 Pack Benih Sayur Organik", mitra: "Tani Makmur Kebun", promo: "Diskon Spesial", pts: 500, stockLeft: 0, stockTotal: 10, address: "Jl. Kebayoran Baru No. 8, Jakarta Selatan", icon: "hot-pot 2.png", active: false },
    { id: 5, category: "Minuman", title: "Diskon Mixo 10%", mitra: "Mixo Drinks", promo: "Diskon Spesial UMKM", pts: 1300, stockLeft: 11, stockTotal: 20, address: "Jl. Tebet Raya No. 19, Jakarta Selatan", icon: "water-bottle 2.png", active: true },
    { id: 6, category: "Gaming", title: "Diskon Diamond MLBB 15%", mitra: "Reonn Shop", promo: "Diskon Spesial UMKM", pts: 1100, stockLeft: 10, stockTotal: 20, address: "Jl. Mampang Prapatan No. 3, Jakarta Selatan", icon: "hot-pot 2.png", active: true },
    { id: 7, category: "Gaming", title: "Diskon Diamond Mlbb 30%", mitra: "Reonski Shop", promo: "Diskon Spesial UMKM", pts: 1600, stockLeft: 3, stockTotal: 10, address: "Jl. Panglima Polim No. 22, Jakarta Selatan", icon: "hot-pot 2.png", active: true }
  ];

  document.addEventListener("DOMContentLoaded", () => {
    loadUserProfile();
    loadUserStats();
    loadReportHistory();
    loadUserVouchers();
  });

  function loadUserProfile() {
    const currentUser = localStorage.getItem("natura_user") || "ReonnSkie";
    const cleanUsername = currentUser.toLowerCase().replace(/\s+/g, "");

    document.getElementById("userProfileName").textContent = currentUser;
    document.getElementById("userProfileEmail").textContent = `${cleanUsername}19@gmail.com`;

    const userJoinedKey = `natura_user_joined_${currentUser}`;
    let joinedDate = localStorage.getItem(userJoinedKey) || localStorage.getItem("natura_created_at");

    if (!joinedDate) {
      const now = new Date();
      const months = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];
      joinedDate = `${months[now.getMonth()]} ${now.getFullYear()}`;
      localStorage.setItem(userJoinedKey, joinedDate);
    }

    document.getElementById("userJoinedText").textContent = `Bergabung sejak ${joinedDate}`;
  }

  function loadUserStats() {
    const username = localStorage.getItem("natura_user");
    let reports = JSON.parse(localStorage.getItem("natura_reports") || "[]");
    const notifs = JSON.parse(localStorage.getItem("natura_notifs") || "[]");

    // Filter reports belonging strictly to the current user (Riwayat Laporan)
    const userReports = username 
      ? reports.filter(r => !r.user || r.user === username)
      : reports;

    const userReportMap = new Map();
    userReports.forEach(r => userReportMap.set(String(r.id), r));

    // Sync report status from matching notification IF report exists in user's Riwayat Laporan
    let reportsUpdated = false;
    notifs.forEach(n => {
      if (n.reportId && userReportMap.has(String(n.reportId))) {
        const matchingReport = userReportMap.get(String(n.reportId));
        const title = (n.title || '').toLowerCase();
        const status = (n.status || '').toLowerCase();
        const isApproved = status === "disetujui" || status === "terverifikasi" || n.isVerified || title.includes("disetujui") || title.includes("terverifikasi");

        if (isApproved && matchingReport.status !== "Disetujui") {
          matchingReport.status = "Disetujui";
          reportsUpdated = true;
        }
      }
    });

    if (reportsUpdated) {
      localStorage.setItem("natura_reports", JSON.stringify(reports));
    }

    // Count strictly from user's Riwayat Laporan
    const totalSent = userReports.length;
    const totalApproved = userReports.filter(r => {
      const status = (r.status || '').toLowerCase();
      return status === "disetujui" || status === "terverifikasi";
    }).length;

    const claimedVouchers = JSON.parse(localStorage.getItem("natura_claimed_vouchers") || "[]");
    const userPointsKey = username ? `natura_user_points_${username}` : "natura_user_points";
    const points = localStorage.getItem(userPointsKey) || "0";

    document.getElementById("statTotalPoints").textContent = points;
    document.getElementById("statReportsSent").textContent = totalSent;
    document.getElementById("statReportsApproved").textContent = totalApproved;
    document.getElementById("statVouchersOwned").textContent = claimedVouchers.length;
  }

  function loadReportHistory() {
    const historyList = document.getElementById("historyList");
    if (!historyList) return;

    const username = localStorage.getItem("natura_user");
    const reports = JSON.parse(localStorage.getItem("natura_reports") || "[]");

    const userReports = username 
      ? reports.filter(r => !r.user || r.user === username)
      : reports;

    if (userReports.length === 0) {
      historyList.innerHTML = `
        <div class="text-white-50 text-center py-4" style="font-size: 13px;">
          Belum ada riwayat laporan yang dikirim.
        </div>
      `;
      return;
    }

    historyList.innerHTML = userReports.slice(0, 4).map(item => `
      <div class="history-item">
        <div class="pin-icon-bg">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5-2.5z"/>
          </svg>
        </div>
        <div class="flex-grow-1">
          <div class="history-title text-truncate" style="max-width: 220px;">${escapeHtml(item.road || 'Lokasi Laporan')}</div>
          <div class="history-sub">${escapeHtml(item.date || '')}</div>
        </div>
      </div>
    `).join('');
  }

  function loadUserStats() {
  const username = localStorage.getItem("natura_user");
  let reports = JSON.parse(localStorage.getItem("natura_reports") || "[]");
  const notifs = JSON.parse(localStorage.getItem("natura_notifs") || "[]");

  // Filter reports belonging strictly to the current user
  const userReports = username 
    ? reports.filter(r => !r.user || r.user === username)
    : reports;

  const userReportMap = new Map();
  userReports.forEach(r => userReportMap.set(String(r.id), r));

  // Sync report status from matching notification
  let reportsUpdated = false;
  notifs.forEach(n => {
    if (n.reportId && userReportMap.has(String(n.reportId))) {
      const matchingReport = userReportMap.get(String(n.reportId));
      const title = (n.title || '').toLowerCase();
      const status = (n.status || '').toLowerCase();
      const isApproved = status === "disetujui" || status === "terverifikasi" || n.isVerified || title.includes("disetujui") || title.includes("terverifikasi");

      if (isApproved && matchingReport.status !== "Disetujui") {
        matchingReport.status = "Disetujui";
        reportsUpdated = true;
      }
    }
  });

  if (reportsUpdated) {
    localStorage.setItem("natura_reports", JSON.stringify(reports));
  }

  // Count strictly from user's Riwayat Laporan
  const totalSent = userReports.length;
  const totalApproved = userReports.filter(r => {
    const status = (r.status || '').toLowerCase();
    return status === "disetujui" || status === "terverifikasi";
  }).length;

  // Retrieve user's claimed vouchers
  const userClaimedKey = username ? `natura_claimed_vouchers_${username}` : "natura_claimed_vouchers";
  let claimedVouchers = JSON.parse(
    localStorage.getItem(userClaimedKey) || 
    localStorage.getItem(`vouchers_${username}`) || 
    localStorage.getItem("natura_claimed_vouchers") || 
    "[]"
  );

  if (username) {
    claimedVouchers = claimedVouchers.filter(v => !v.user || v.user === username);
  }

  const userPointsKey = username ? `natura_user_points_${username}` : "natura_user_points";
  const points = localStorage.getItem(userPointsKey) || localStorage.getItem(`natura_user_pts_${username}`) || "0";

  document.getElementById("statTotalPoints").textContent = points;
  document.getElementById("statReportsSent").textContent = totalSent;
  document.getElementById("statReportsApproved").textContent = totalApproved;
  document.getElementById("statVouchersOwned").textContent = claimedVouchers.length;
}

function loadUserVouchers() {
  const voucherList = document.getElementById("voucherList");
  if (!voucherList) return;

  const username = localStorage.getItem("natura_user");
  const userClaimedKey = username ? `natura_claimed_vouchers_${username}` : "natura_claimed_vouchers";
  let claimedVouchers = JSON.parse(
    localStorage.getItem(userClaimedKey) || 
    localStorage.getItem(`vouchers_${username}`) || 
    localStorage.getItem("natura_claimed_vouchers") || 
    "[]"
  );

  if (username) {
    claimedVouchers = claimedVouchers.filter(v => !v.user || v.user === username);
  }

  let availableVouchers = [];
  const stored = localStorage.getItem("natura_vouchers");
  if (stored) {
    availableVouchers = JSON.parse(stored);
  } else {
    localStorage.setItem("natura_vouchers", JSON.stringify(defaultVouchersList));
    availableVouchers = defaultVouchersList;
  }

  const vouchersToDisplay = claimedVouchers.length > 0 
    ? claimedVouchers 
    : availableVouchers;

  if (vouchersToDisplay.length === 0) {
    voucherList.innerHTML = `
      <div class="text-white-50 text-center py-4" style="font-size: 13px;">
        Belum ada voucher yang tersedia.
      </div>
    `;
    return;
  }

  voucherList.innerHTML = vouchersToDisplay.map(v => {
    const title = v.mitra || v.title || 'Voucher UMKM';
    const promo = v.promo || v.desc || 'Diskon Spesial';
    const tagText = v.expiry ? v.expiry : (v.pts ? `${v.pts} pts` : 'Tersedia');
    const iconSrc = v.icon || (v.category === 'Minuman' ? 'water-bottle 2.png' : 'hot-pot 2.png');

    return `
      <div class="voucher-item-box">
        <div class="voucher-left">
          <div class="voucher-icon-circle">
            <img src="${iconSrc}" alt="Icon" onerror="this.onerror=null; this.src='hot-pot 2.png';">
          </div>
          <div>
            <div class="voucher-name">${escapeHtml(title)}</div>
            <div class="voucher-desc">${escapeHtml(promo)}</div>
          </div>
        </div>
        <div class="voucher-expiry">${escapeHtml(tagText)}</div>
      </div>
    `;
  }).join('');
}

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  function logout(event) {
    if (event) event.preventDefault();
    localStorage.removeItem("natura_user");
    window.location.replace("login.html");
  }
</script>
